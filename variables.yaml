# ──────────────────────────────────────────────────────────────────────────────
# variables.yaml — Definicao das variaveis 2D do modelo Eta / BESM
#
# A ORDEM das variaveis deve coincidir com a ordem no arquivo CTL do modelo.
# Cada variavel ocupa uma fatia (NY x NX) consecutiva no arquivo binario.
#
# Campos:
#   name        : nome da variavel (igual ao CTL)
#   description : descricao legivel para titulos e metadados
#   units       : unidade de medida
#   cmap        : colormap matplotlib (ou "precip" para colormap proprio)
#   vmin/vmax   : limites do colorbar (null = escala automatica por percentis)
#   precip      : true se e variavel de precipitacao (conversao m->mm no COG)
#   enabled     : false para pular completamente (plot + COG)
#
# Para processar apenas um subconjunto, use --vars no CLI ou edite enabled.
# ──────────────────────────────────────────────────────────────────────────────

variables:

  - name: PSLM
    description: "Pressao ao Nivel do Mar (Mesinger)"
    units: hPa
    cmap: RdBu_r
    vmin: 990
    vmax: 1030
    precip: false
    enabled: true

  - name: PSLC
    description: "Pressao de Superficie"
    units: hPa
    cmap: RdBu_r
    vmin: 980
    vmax: 1030
    precip: false
    enabled: true

  - name: TP2M
    description: "Temperatura 2 m"
