# ──────────────────────────────────────────────────────────────────────────────
# config.yaml — Configuracao do modelo Eta / BESM (SisMOM / CPTEC-INPE)
#
# Edite este arquivo para trocar de rodada ou ajustar caminhos.
# Os scripts leem este arquivo automaticamente ao iniciar.
# ──────────────────────────────────────────────────────────────────────────────

# ── Parametros do modelo (fixos por configuracao) ─────────────────────────────
# A data/hora da rodada e passada via --run no CLI (nao fica neste arquivo).
#   --run 2026060600   -> rodada completa YYYYMMDDHH
#   --run 00           -> 00Z de hoje (data do sistema)
#   --run 12           -> 12Z de hoje
# Fallback (se --run nao for passado): variavel de ambiente RUN_TAG
run:
  ntimes: 121                # numero de passos de tempo (inclui analise = 0)
  dt_hours: 1                # intervalo de saida do modelo em horas

# ── Grade horizontal ──────────────────────────────────────────────────────────
grid:
  nx: 2399                   # numero de pontos em longitude
  ny: 1671                   # numero de pontos em latitude
  lon0: -90.99252            # longitude do canto sudoeste (graus E)
  lat0: -38.12884            # latitude do canto sudoeste (graus N)
  dlon: 0.03                 # resolucao em longitude (graus)
  dlat: 0.03                 # resolucao em latitude (graus)

# ── Formato do arquivo binario (GrADS) ───────────────────────────────────────
model:
  undef: 1.0e+20             # valor indefinido do modelo
  dtype: ">f4"               # tipo numpy: ">f4" big-endian, "<f4" little-endian
  file_prefix: "Eta03_BESM_{run_tag}+"   # {run_tag} e substituido automaticamente
  file_suffix: "_2D.bin"

# ── Caminhos de dados e saida ─────────────────────────────────────────────────
paths:
  # Base dos dados no servidor SisMOM.
  # Caminho completo: <data_base>/<run_tag>/regional/eta/2D/
  # Deixe vazio ("") para usar a variavel de ambiente SISMOM_DATA_BASE
  # ou o diretorio local data/ do projeto.
  data_base: ""

  output_dir: "figuras/campos"        # PNGs dos campos horarios
  accum_dir:  "figuras/acumulados"    # PNGs dos acumulados
  cog_dir:    "cog"                   # COG GeoTIFF
  log_dir:    "logs"                  # arquivos de log

# ── Configuracoes de figura ───────────────────────────────────────────────────
figure:
  ext: "png"                 # formato de saida: png, pdf, svg
  dpi: 120                   # resolucao em pontos por polegada

# ── Acumulados de precipitacao ────────────────────────────────────────────────
accumulation:
  hours: 24                  # periodo padrao de acumulo (horas)
                             # Para 24h: gera ACUM00Z e ACUM12Z
                             # Para outros valores: janelas sequenciais
  precip_vars:               # variaveis para as quais gerar acumulados
    - PREC
    - PRCV
    - PRGE
